# Versión base. El último número (parche) lo pone el CI automáticamente
# (cantidad de commits), así cada compilación sube de versión sola.
major=1
minor=0

# Nombre de la app (lo que se ve en el celular, notificaciones, carpeta de descargas y el APK).
# Para cambiar el nombre basta con editar esta línea. NO cambia el paquete com.santyramos.mirador:
# así las actualizaciones siguen instalándose encima sin perder datos.
nombre=Mirador
