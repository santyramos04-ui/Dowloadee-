name: Compilar
on:
  push:
    branches: ['ccr-**']
    paths-ignore: ['tests/sitios/**', '.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: SDK de Android (la imagen de GitHub ya trae uno; solo aceptamos licencias)
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y probar
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-prueba
          path: app/build/outputs/apk/release/*.apk
