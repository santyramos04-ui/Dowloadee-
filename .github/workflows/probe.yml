name: Sonda de versiones y red
on:
  push:
    branches: ['ccr-**']
    paths: ['.github/workflows/probe.yml', 'tests/sitios/**']
  workflow_dispatch:
jobs:
  versiones:
    runs-on: ubuntu-latest
    steps:
      - run: |
          C=https://repo.maven.apache.org/maven2
          lista() { curl -fsS --max-time 30 "$1/maven-metadata.xml" | grep '<version>' | sed -E 's/ *<\/?version>//g' | sort -V | tail -${2:-6} | tr '\n' ' '; echo; }
          echo "kotlin-stdlib:"; lista $C/org/jetbrains/kotlin/kotlin-stdlib 10
          echo "ksp symbol-processing-gradle-plugin:"; lista $C/com/google/devtools/ksp/symbol-processing-gradle-plugin 10
          echo "ksp marker:"; lista $C/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin 10 || true
          echo "compose compiler gradle plugin:"; lista $C/org/jetbrains/kotlin/compose-compiler-gradle-plugin 6
          echo "kotlin-serialization plugin:"; lista $C/org/jetbrains/kotlin/kotlin-serialization 4
          echo "coil3 compose:"; lista $C/io/coil-kt/coil3/coil-compose 4
          echo "coil3 okhttp:"; lista $C/io/coil-kt/coil3/coil-network-okhttp 4
          echo "desugar:"; lista $C/com/android/tools/desugar_jdk_libs/desugar_jdk_libs 3 || true
          echo "jsoup:"; lista $C/org/jsoup/jsoup 3
          echo "mockwebserver:"; lista $C/com/squareup/okhttp3/mockwebserver 3
          echo "junit5? kotlin-test:"; lista $C/org/jetbrains/kotlin/kotlin-test 3
          java -version 2>&1 | head -1; node --version; python3 --version
  sitios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -U "yt-dlp[default]"
      - name: Extraer información de los enlaces de prueba
        run: python3 tests/sitios/comprobar_sitios.py tests/sitios/sitios.json resultado.md
      - run: cat resultado.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
